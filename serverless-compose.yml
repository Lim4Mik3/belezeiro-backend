params:
  default:
    env: 'dev'

services:
  # Shared infrastructure resources (API Gateway, EventBridge, DynamoDB, etc.)
  resources:
    path: resources
    params:
      stage: 'dev'
      region: ${opt:region, 'us-east-2'}

  # IAM module
  iam:
    path: src/modules/iam
    params:
      stage: 'dev'
      region: ${opt:region, 'us-east-2'}
    dependsOn:
      - resources

