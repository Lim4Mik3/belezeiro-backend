# Business Module - Serverless Configuration
# Handles business and unit management

service: belezeiro-business

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${param:region, 'us-east-2'}
  stage: ${param:stage, 'dev'}

  # Use shared HTTP API Gateway
  httpApi:
    id: !ImportValue ${self:provider.stage}-BelezeiroHttpApiId

  # Global environment variables for all functions
  environment:

  # IAM Permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - rds-data:ExecuteStatement
            - rds-data:BatchExecuteStatement
          Resource:
            - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:*

functions:
  # Create Business
  create-business:
    handler: handlers/create-business.fetch
    description: Create a new business
    memorySize: 512
    timeout: 30
    events:
      - httpApi:
          path: /business
          method: POST
    environment:
      FUNCTION_NAME: create-business

  # Update Business
  update-business:
    handler: handlers/update-business.fetch
    description: Update an existing business
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /business/{id}
          method: PUT
    environment:
      FUNCTION_NAME: update-business

  # Delete Business
  delete-business:
    handler: handlers/delete-business.fetch
    description: Delete a business
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /business/{id}
          method: DELETE
    environment:
      FUNCTION_NAME: delete-business

  # Create Unit
  create-unit:
    handler: handlers/create-unit.fetch
    description: Create a new unit for a business
    memorySize: 512
    timeout: 30
    events:
      - httpApi:
          path: /business/{businessId}/units
          method: POST
    environment:
      FUNCTION_NAME: create-unit

  # Update Unit
  update-unit:
    handler: handlers/update-unit.fetch
    description: Update an existing unit
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /business/{businessId}/units/{unitId}
          method: PUT
    environment:
      FUNCTION_NAME: update-unit

  # Delete Unit
  delete-unit:
    handler: handlers/delete-unit.fetch
    description: Delete a unit
    memorySize: 256
    timeout: 10
    events:
      - httpApi:
          path: /business/{businessId}/units/{unitId}
          method: DELETE
    environment:
      FUNCTION_NAME: delete-unit

# Package configuration
package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.env*'
    - '!*.md'
    - 'handlers/**'
    - 'app/**'
    - 'domain/**'
    - 'infra/**'

plugins:
  - serverless-dotenv-plugin
  - serverless-plugin-typescript
