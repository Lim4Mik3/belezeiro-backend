# Environment variables
# Bun will automatically load these files in order
[env]
files = [
  ".env",
  "packages/core/.env",
  "packages/iam/.env",
  "packages/shared/.env"
]

[test]
# Configuração de testes do Bun
preload = ["./test/setup.ts"]
coverage = true
coverageThreshold = 80

# Timeout padrão para testes (em ms)
timeout = 5000

# Rodar testes em paralelo
parallel = true

# Padrões de arquivos de teste
# Por padrão, Bun procura por *.test.ts, *.spec.ts, etc.
# Você pode customizar aqui se necessário
# testMatch = ["**/__tests__/**/*.test.ts", "**/*.spec.ts"]
