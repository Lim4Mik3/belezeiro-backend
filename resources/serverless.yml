# Shared Resources Service
# Contains infrastructure shared across all modules (EventBridge, DynamoDB, etc.)

service: belezeiro-resources

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-2'}
  stage: ${opt:stage, 'dev'}

# Import resource definitions
resources:
  # HTTP API Gateway (shared across all modules)
  - ${file(api-gateway.yml)}

  # EventBridge resources
  - ${file(eventbridge.yml)}

  # DynamoDB resources
  - ${file(dynamodb.yml)}

# No functions needed - this service only provisions infrastructure
