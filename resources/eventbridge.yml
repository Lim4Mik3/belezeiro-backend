# EventBridge Resources - Shared across all modules
# Handles event-driven communication between IAM, Business, and other modules
Resources:
  BelezeiroEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: belezeiro-${self:provider.stage, 'dev'}-event-bus
      Tags:
        - Key: Environment
          Value: ${self:provider.stage, 'dev'}
        - Key: Application
          Value: belezeiro

  BelezeiroEventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: belezeiro-${self:provider.stage, 'dev'}-archive
      SourceArn: !GetAtt BelezeiroEventBus.Arn
      Description: Archive for all application events with 30-day retention
      RetentionDays: 30
      EventPattern:
        source:
          - prefix: "belezeiro."

  BelezeiroEventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: belezeiro-${self:provider.stage, 'dev'}-event-dlq
      MessageRetentionPeriod: 1209600 # 14 days
      VisibilityTimeout: 300
      Tags:
        - Key: Environment
          Value: ${self:provider.stage, 'dev'}
        - Key: Application
          Value: belezeiro

Outputs:
  BelezeiroEventBusName:
    Description: Name of the Belezeiro Event Bus
    Value: !Ref BelezeiroEventBus
    Export:
      Name: belezeiro-${self:provider.stage, 'dev'}-event-bus-name

  BelezeiroEventBusArn:
    Description: ARN of the Belezeiro Event Bus
    Value: !GetAtt BelezeiroEventBus.Arn
    Export:
      Name: belezeiro-${self:provider.stage, 'dev'}-event-bus-arn

  BelezeiroEventDLQUrl:
    Description: URL of the Belezeiro Event DLQ
    Value: !Ref BelezeiroEventDLQ
    Export:
      Name: belezeiro-${self:provider.stage, 'dev'}-event-dlq-url

  BelezeiroEventDLQArn:
    Description: ARN of the Belezeiro Event DLQ
    Value: !GetAtt BelezeiroEventDLQ.Arn
    Export:
      Name: belezeiro-${self:provider.stage, 'dev'}-event-dlq-arn
